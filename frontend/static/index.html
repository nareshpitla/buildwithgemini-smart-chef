<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Chef</title>
<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #ea580c;
    --accent-dark: #c2410c;
    --accent-light: #fff7ed;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --header-bg: rgba(255, 255, 255, 0.85);
    --input-bg: #ffffff;
    --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
  }

  body.dark {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --border: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --header-bg: rgba(15, 23, 42, 0.85);
    --input-bg: #1e293b;
    --accent-light: rgba(234, 88, 12, 0.15);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  /* --- Glassmorphism Header --- */
  header {
    background: var(--header-bg);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0.85rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 20;
    transition: background-color 0.3s ease;
  }
  .header-brand { display: flex; align-items: center; gap: 0.75rem; }
  .header-avatar {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #fb923c, #ea580c);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.35rem;
    box-shadow: 0 2px 8px rgba(234, 88, 12, 0.25);
  }
  .header-title { font-weight: 700; font-size: 1.15rem; color: var(--text-primary); letter-spacing: -0.01em; }
  .header-subtitle { font-size: 0.8rem; color: var(--text-secondary); font-weight: 500; }
  
  .header-actions { display: flex; align-items: center; gap: 0.6rem; }
  .icon-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 0.45rem 0.75rem;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
  }
  .icon-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.25rem 0.65rem;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    color: #166534;
  }
  body.dark .status-badge {
    background: rgba(34, 197, 94, 0.1);
    border-color: rgba(34, 197, 94, 0.3);
    color: #4ade80;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
  }

  /* --- Dietary Preference Filter Chips --- */
  .dietary-bar {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 0.5rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .dietary-bar::-webkit-scrollbar { display: none; }
  .dietary-label { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
  .diet-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 0.25rem 0.7rem;
    border-radius: 16px;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    user-select: none;
  }
  .diet-chip.active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent-dark);
    font-weight: 600;
  }

  /* --- Dialogue Stream / Log Area --- */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    scroll-behavior: smooth;
  }

  .msg {
    display: flex;
    gap: 0.75rem;
    max-width: 88%;
    position: relative;
    animation: slideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.agent { align-self: flex-start; }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .msg.agent .msg-avatar { background: var(--accent-light); border: 1px solid rgba(234, 88, 12, 0.2); }
  .msg.user .msg-avatar { background: var(--card-bg); border: 1px solid var(--border); }

  .bubble-wrapper { position: relative; max-width: 100%; }
  .bubble {
    padding: 0.85rem 1.15rem;
    border-radius: 18px;
    font-size: 0.95rem;
    line-height: 1.55;
    text-align: left;
    word-break: break-word;
    box-shadow: var(--shadow-sm);
  }

  .msg.agent .bubble {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-top-left-radius: 4px;
  }

  .msg.user .bubble {
    background: linear-gradient(135deg, #ea580c, #c2410c);
    color: #ffffff;
    border-top-right-radius: 4px;
    box-shadow: 0 3px 10px rgba(234, 88, 12, 0.2);
  }

  .copy-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 0.75rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s ease, background-color 0.2s ease;
  }
  .msg.agent:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* Rich A2UI Cards */
  .bubble.rich { background: transparent; border: none; padding: 0; box-shadow: none; max-width: 100%; width: 100%; }

  /* --- Typing Indicator --- */
  .typing-dots { display: inline-flex; align-items: center; gap: 4px; padding: 0.5rem 0.2rem; }
  .typing-dots span {
    width: 7px;
    height: 7px;
    background: var(--accent);
    border-radius: 50%;
    opacity: 0.4;
    animation: typing 1.4s infinite ease-in-out;
  }
  .typing-dots span:nth-child(1) { animation-delay: 0s; }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  /* --- Quick Action Toolbar & Prompt Suggestions Row --- */
  .quick-toolbar {
    display: flex;
    gap: 0.55rem;
    padding: 0.5rem 1.25rem 0.2rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .quick-toolbar::-webkit-scrollbar { display: none; }

  .prompt-suggestions {
    display: flex;
    gap: 0.55rem;
    padding: 0.2rem 1.25rem 0.4rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .prompt-suggestions::-webkit-scrollbar { display: none; }

  .prompt-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 0.45rem 0.95rem;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .prompt-btn:hover {
    border-color: var(--accent);
    color: var(--accent-dark);
    background: var(--accent-light);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  /* --- Input Bar Container --- */
  .input-container {
    background: var(--header-bg);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 0.85rem 1.25rem 1.1rem;
    transition: background-color 0.3s ease;
  }
  form {
    display: flex;
    gap: 0.65rem;
    max-width: 820px;
    margin: 0 auto;
    position: relative;
  }
  input {
    flex: 1;
    padding: 0.85rem 1.15rem;
    border: 1px solid var(--border);
    border-radius: 14px;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--input-bg);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.15);
  }
  button[type="submit"] {
    padding: 0.85rem 1.35rem;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #ea580c, #c2410c);
    color: #ffffff;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2px 6px rgba(234, 88, 12, 0.25);
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  button[type="submit"]:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(234, 88, 12, 0.35);
  }

  /* --- A2UI Component Styles --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    background: var(--card-bg);
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }

  /* Custom Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  body.dark ::-webkit-scrollbar-thumb { background: #475569; }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="header-avatar">🍳</div>
    <div>
      <div class="header-title">Smart Chef</div>
      <div class="header-subtitle">AI Culinary & Recipe Concierge</div>
    </div>
  </div>
  <div class="header-actions">
    <button type="button" class="icon-btn" onclick="toggleDarkMode()" id="themeBtn" title="Toggle Dark/Light Mode">🌙</button>
    <button type="button" class="icon-btn" onclick="clearChat()" title="Clear Chat Stream">🔄 Clear</button>
    <div class="status-badge">
      <span class="status-dot"></span>
      Online
    </div>
  </div>
</header>

<!-- Dietary Filter Chips Bar -->
<div class="dietary-bar">
  <span class="dietary-label">Dietary Filters:</span>
  <div class="diet-chip" onclick="toggleDietChip(this, 'Vegan')">🌱 Vegan</div>
  <div class="diet-chip" onclick="toggleDietChip(this, 'Gluten-Free')">🌾 Gluten-Free</div>
  <div class="diet-chip" onclick="toggleDietChip(this, 'Dairy-Free')">🥛 Dairy-Free</div>
  <div class="diet-chip" onclick="toggleDietChip(this, 'Nut-Free')">🥜 Nut-Free</div>
</div>

<div id="log"></div>

<!-- Quick Actions Toolbar -->
<div class="quick-toolbar">
  <button type="button" class="prompt-btn" onclick="sendExamplePrompt('Show my pantry stock')">📦 Pantry Stock</button>
  <button type="button" class="prompt-btn" onclick="sendExamplePrompt('View my grocery shopping list')">🛒 Shopping List</button>
  <button type="button" class="prompt-btn" onclick="sendExamplePrompt('Calculate nutrition and scaling for 4 servings')">🔢 Scale Servings</button>
</div>

<!-- Prompt Suggestions Row -->
<div class="prompt-suggestions">
  <button type="button" class="prompt-btn" onclick="sendExamplePrompt('What can I cook with my pantry items?')">🥫 Check Pantry Recipes</button>
  <button type="button" class="prompt-btn" onclick="sendExamplePrompt('Suggest a recipe and generate a dish preview')">🥗 Recipe & Dish Preview</button>
  <button type="button" class="prompt-btn" onclick="sendExamplePrompt('Find nearby grocery stores')">📍 Find Nearby Grocers</button>
</div>

<div class="input-container">
  <form id="form">
    <input id="input" placeholder="Ask Smart Chef for recipe ideas, pantry checks, or grocery stores..." autocomplete="off" autofocus>
    <button type="submit">
      Send
      <span class="material-symbols-outlined" style="font-size:1.1rem; color:#fff;">send</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const activeDietary = new Set();

function toggleDarkMode() {
  document.body.classList.toggle("dark");
  const isDark = document.body.classList.contains("dark");
  document.getElementById("themeBtn").textContent = isDark ? "☀️" : "🌙";
}

function clearChat() {
  log.innerHTML = "";
}

function toggleDietChip(el, tag) {
  if (activeDietary.has(tag)) {
    activeDietary.delete(tag);
    el.classList.remove("active");
  } else {
    activeDietary.add(tag);
    el.classList.add("active");
  }
}

function sendExamplePrompt(txt) {
  input.value = txt;
  form.dispatchEvent(new Event("submit", { cancelable: true }));
}

function copyBubbleText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = "Copied! ✨";
    setTimeout(() => { btn.textContent = orig; }, 1500);
  });
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "msg-avatar", who === "agent" ? "🍳" : "👤");
  const wrapper = el("div", "bubble-wrapper");
  const b = el("div", "bubble");
  
  wrapper.appendChild(b);
  if (who === "agent") {
    const copyBtn = el("button", "copy-btn", "📋 Copy");
    copyBtn.onclick = () => copyBubbleText(copyBtn, b.innerText);
    wrapper.appendChild(copyBtn);
  }

  m.appendChild(avatar);
  m.appendChild(wrapper);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  let text = input.value.trim();
  if (!text) return;

  // Append active dietary filter context if selected
  if (activeDietary.size > 0) {
    const dietList = Array.from(activeDietary).join(", ");
    text += ` [Dietary restrictions: ${dietList}]`;
  }

  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent");
  
  // Show animated typing indicator
  const dots = el("div", "typing-dots");
  dots.appendChild(el("span")); dots.appendChild(el("span")); dots.appendChild(el("span"));
  b.appendChild(dots);

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
